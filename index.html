<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barcode Generator</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <header class="header">
    <h1>Barcode Generator</h1>
    <button class="camera-btn" onclick="startCamera()"><i class="bi bi-camera"></i></button>
  </header>

  <div class="card">
    <div class="input-wrapper">
      <input id="upcInput" placeholder="Enter Barcode" />
      <i class="bi bi-x clear-input" id="clearInput"></i>
    </div>
    <button onclick="generate()" class="longbtn">Create Barcode</button>
  </div>

  <div class="card" id="video-card" hidden>
    <div class="video-wrapper">
      <video id="video"></video>
    </div>
  </div>

  <div class="card barcode-card hidden" id="barcodeCard">
    <svg id="barcode"></svg>
  </div>

  <div class="card">
    <h3>History</h3>
    <div id="history"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="./script.js"></script>
</body>
</html>
